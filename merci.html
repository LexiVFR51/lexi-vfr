<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci | Lexi VFR - Excellence & Sérénité</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark-blue: #1a252f; --soft-white: #fcfcfc; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-white); color: var(--dark-blue); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* Background subtil */
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), url('bg-planning.png') center/cover; z-index: -1; }

        .thank-you-card { background: white; padding: 60px; text-align: center; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); border-top: 5px solid var(--gold); max-width: 600px; width: 90%; transform: translateY(0); animation: fadeInUp 0.8s ease-out; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .icon-check { font-size: 4rem; color: var(--gold); margin-bottom: 25px; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 15px; color: var(--dark-blue); }
        
        p { font-size: 1.1rem; color: #555; line-height: 1.6; margin-bottom: 30px; }

        .divider { width: 50px; height: 2px; background: var(--gold); margin: 0 auto 30px; }

        .btn-home { display: inline-block; padding: 15px 40px; background: var(--dark-blue); color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 600; border-radius: 2px; transition: 0.3s; }
        .btn-home:hover { background: var(--gold); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

        footer { position: absolute; bottom: 30px; font-size: 0.75rem; letter-spacing: 1px; color: #aaa; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="thank-you-card">
        <div class="icon-check"><i class="fas fa-envelope-open-text"></i></div>
        <h1>Merci, Alexia a bien reçu votre message.</h1>
        <div class="divider"></div>
        <p>
            Votre demande d'intervention ou de renseignement est en cours d'examen. 
            Je reviendrai vers vous dans les plus brefs délais pour confirmer nos prochaines étapes.
        </p>
        <a href="index.html" class="btn-home">Retour à l'accueil</a>
    </div>

    <footer>LEXI VFR | Services de Nettoyage de Prestige | Fismes</footer>

</body>
</html>
