<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Lexi VFR - Nettoyage à Fismes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark-blue: #1a252f; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fff; color: var(--dark-blue); }
        
        /* Navigation */
        nav { background: rgba(255, 255, 255, 0.95); padding: 1rem 0; position: fixed; top: 0; width: 100%; z-index: 2000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav ul { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
        nav ul li { margin: 0 20px; }
        nav ul li a { color: var(--dark-blue); text-decoration: none; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.8rem; font-weight: 600; display: block; padding: 5px 0; }
        
        /* Hero Section avec Image de Fond */
        .hero-small { 
            height: 45vh; 
            background: url('bg-services.png') center/cover no-repeat; 
            margin-top: 60px;
        }
        
        .gold-line { width: 100%; height: 4px; background: var(--gold); }
        
        /* Contenu */
        .content { max-width: 1100px; margin: 0 auto; padding: 60px 20px; text-align: center; box-sizing: border-box; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle-line { width: 60px; height: 2px; background: var(--gold); margin: 0 auto 40px; }
        
        /* Grille des Services */
        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .service-card { 
            padding: 40px 20px; 
            border: 1px solid #f0f0f0; 
            transition: all 0.4s ease; 
            border-radius: 4px;
            background: #fff;
            box-sizing: border-box;
        }
        .service-card:hover { 
            border-color: var(--gold); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.07); 
            transform: translateY(-5px);
        }
        .service-card i { font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; }
        .service-card h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 15px; }
        .service-card p { font-size: 0.95rem; line-height: 1.6; color: #555; }
        
        /* Lien Téléphone */
        .phone-footer {
            color: var(--dark-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .phone-footer:hover {
            color: var(--gold);
        }

        footer { padding: 40px 20px; text-align: center; border-top: 1px solid #eee; margin-top: 40px; font-size: 0.9rem; letter-spacing: 1px; box-sizing: border-box; }

        /* ==========================================
           MODIFICATIONS SPECIFIQUES POUR TELEPHONE
           ========================================== */
        @media (max-width: 768px) {
            nav {
                position: relative; /* Évite de manger de l'espace sur petit écran */
                padding: 0
