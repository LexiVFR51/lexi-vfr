<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demander un devis | Lexi VFR - Fismes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark-blue: #1a252f; --soft-white: #fcfcfc; --light-bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-white); color: var(--dark-blue); overflow-x: hidden; }
        
        /* Navigation Excellence Fixe */
        nav { background: rgba(255, 255, 255, 0.98); padding: 1.2rem 0; position: fixed; top: 0; width: 100%; z-index: 2000; border-bottom: 1px solid rgba(0,0,0,0.05); box-sizing: border-box; }
        nav ul { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
        nav ul li { margin: 0 25px; }
        nav ul li a { color: var(--dark-blue); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 600; transition: 0.3s; display: block; padding: 5px 0; }
        nav ul li a:hover, nav ul li a.active { color: var(--gold); }

        /* Hero Banner Harmonisée */
        .hero-contact { 
            height: 45vh; 
            background: url('bg-services.png') center/cover no-repeat fixed; 
            margin-top: 60px;
        }
        .gold-divider { width: 100%; height: 5px; background: var(--gold); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        /* Structure Conteneur Principal - Bloc remontant sur la bannière */
        .container { max-width: 850px; margin: -50px auto 60px; padding: 0 20px; box-sizing: border-box; position: relative; z-index: 10; }
        .main-card { background: white; padding: 50px; border-radius: 4px; box-shadow: 0 15px 45px rgba(0,0,0,0.05); border-top: 4px solid var(--gold); box-sizing: border-box; }
        
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-top: 0; margin-bottom: 10px; text-align: center; }
        .intro-text { text-align: center; color: #555; margin-bottom: 40px; font-weight: 300; font-size: 1.05rem; }

        /* Formulaire */
        .form-row { display: flex; gap: 25px; margin-bottom: 25px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: #555; }
        input, select, textarea { 
            padding: 14px 18px; 
            border: 1px solid #e2e8f0; 
            border-radius: 4px; 
            font-family: 'Poppins', sans-serif; 
            font-size: 0.95rem; 
            background: #fdfdfd;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            color: var(--dark-blue);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            background: #fff;
        }

        /* Cases à cocher Prestations */
        .services-selection { display: flex; gap: 15px; margin-top: 5px; }
        .check-item { 
            flex: 1; 
            background: var(--light-bg); 
            padding: 14px; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
            box-sizing: border-box;
            font-weight: 400;
            font-size: 0.95rem;
            border: 1px solid #edf2f7;
            transition: 0.3s;
        }
        .check-item:hover { border-color: var(--gold); background: #fff; }
        .check-item input { width: auto; margin-right: 12px; cursor: pointer; }

        /* Bouton Soumission Or/Bleu */
        .btn-submit { 
            background: var(--dark-blue); 
            color: white; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 2px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: 0.4s; 
            margin-top: 35px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .btn-submit:hover { 
            background: var(--gold); 
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            transform: translateY(-1px);
        }

        /* Footer */
        footer { text-align: center; padding: 50px 20px; background: #fff; border-top: 1px solid #eee; margin-top: 80px; box-sizing: border-box; }
        footer p { font-size: 0.85rem; letter-spacing: 1px; color: #999; margin: 0 0 10px 0; }
        footer .phone { color: var(--dark-blue); font-weight: 600; display: inline-block; text-decoration: none; transition: color 0.3s; }
        footer .phone:hover { color: var(--gold); }

        /* ==========================================
           MODIFICATIONS SPECIFIQUES POUR TELEPHONE
           ========================================== */
        @media (max-width: 900px) { 
            nav { position: relative; padding: 0.5rem 0; }
            nav ul { flex-direction: column; align-items: center; }
            nav ul li { margin: 6px 0; }
            
            .hero-contact { height: 25vh; margin-top: 0; background-attachment: scroll; } 
            .container { margin: 20px auto; padding: 0 15px; }
            .main-card { padding: 30px 20px; }
            
            h2 { font-size: 1.8rem; }
            .intro-text { font-size: 0.95rem; margin-bottom: 30px; }
            
            .form-row { flex-direction: column; gap: 20px; margin-bottom: 0; }
            .form-group { margin-bottom: 20px; }
            .services-selection { flex-direction: column; gap: 10px; }
            .btn-submit { margin-top: 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="planning.html">Planning</a></li>
            <li><a href="avis.html">Avis</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="hero-contact"></div>
    <div class="gold-divider"></div>

    <div class="container">
        <div class="main-card">
            <h2>Demander un devis gratuit</h2>
            <p class="intro-text">Votre projet d'entretien sur mesure à Fismes et ses environs. Réponse sous 24h.</p>

            <form action="https://script.google.com/macros/s/AKfycbz2GEnMJpOkDO22T0eP9rfDbNHI0s877H8DTVVnMnHoTB43z-agKGwGJytw6SgpON_x/exec" method="POST">

                <div class="form-row">
                    <div class="form-group">
                        <label>Nom & Prénom</label>
                        <input type="text" name="nom" placeholder="Votre nom complet" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="tel" name="telephone" placeholder="06 44 24 27 64" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label>Adresse E-mail</label>
                    <input type="email" name="email" placeholder="votre@email.com" required>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label>Adresse de l'intervention</label>
                    <input type="text" name="adresse" placeholder="Rue, Code Postal, Ville (Fismes et sa région)" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Surface estimée (m²)</label>
                        <input type="number" name="surface" placeholder="Ex: 75">
                    </div>
                    <div class="form-group">
                        <label>Fréquence souhaitée</label>
                        <select name="frequence">
                            <option value="Regulier">Régulier (Hebdomadaire)</option>
                            <option value="Quinzaine">Une semaine sur deux</option>
                            <option value="Ponctuel">Prestation ponctuelle (Grand nettoyage)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Prestations souhaitées</label>
                    <div class="services-selection">
                        <label class="check-item"><input type="checkbox" name="service" value="Menage"> Ménage</label>
                        <label class="check-item"><input type="checkbox" name="service" value="Repassage"> Repassage</label>
                        <label class="check-item"><input type="checkbox" name="service" value="Vitres"> Vitres</label>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 25px;">
                    <label>Précisions complémentaires</label>
                    <textarea name="message" rows="4" placeholder="Ex: Présence d'animaux domestiques, attentes particulières, preferences d'horaires..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer ma demande de devis</button>
            </form>
        </div>
    </div>

    <footer>
        <p>LEXI VFR — SERVICES DE NETTOYAGE & REPASSAGE À FISMES</p>
        <a href="tel:0644242764" class="phone"><i class="fas fa-phone"></i> 06 44 24 27 64</a>
    </footer>

</body>
