<div class="form-row">
                    <div class="form-group">
                        <label for="surface">Surface environ (m²)</label>
                        <input type="number" name="surface" id="surface" class="form-control" placeholder="Ex: 80">
                    </div>
                    <div class="form-group">
                        <label for="frequence">Fréquence souhaitée</label>
                        <select name="frequence" id="frequence" class="form-control">
                            <option value="ponctuel">Ponctuel (Grand nettoyage)</option>
                            <option value="hebdomadaire">Hebdomadaire</option>
                            <option value="bi-mensuel">Bi-mensuel</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Services souhaités :</label>
                    <div class="services-grid">
                        <label class="checkbox-item"><input type="checkbox" name="service" value="menage"> Ménage</label>
                        <label class="checkbox-item"><input type="checkbox" name="service" value="repassage"> Repassage</label>
                        <label class="checkbox-item"><input type="checkbox" name="service" value="vitres"> Vitres</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Précisions (Animaux, accès...)</label>
                    <textarea name="message" id="message" class="form-control" style="height: 100px;"></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer ma demande</button>
            </form>
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; color: #666; font-size: 0.9em;">
