<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demander un devis | Lexi VFR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark-blue: #1a252f; --light-bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fff; color: #333; overflow-x: hidden; }
        
        /* Navigation */
        nav { background: rgba(255, 255, 255, 0.98); padding: 1rem 0; position: fixed; top: 0; width: 100%; z-index: 2000; border-bottom: 1px solid #eee; }
        nav ul { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
        nav ul li { margin: 0 20px; }
        nav ul li a { color: var(--dark-blue); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; font-weight: 600; display: block; padding: 5px 0; }

        /* Hero Background PNG */
        .hero-contact { 
            height: 40vh; 
            background: url('bg-contact.png') center/cover no-repeat fixed; 
            margin-top: 60px;
        }

        /* Formulaire Style Shiva */
        .container { max-width: 900px; margin: -50px auto 60px; background: white; padding: 40px; position: relative; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); box-sizing: border-box; width: 90%; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--dark-blue); margin-bottom: 5px; border-bottom: 3px solid var(--gold); display: inline-block; }
        .promo-text { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95rem; }

        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select, textarea { 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-family: inherit; 
            font-size: 0.95rem; 
            background: #fff;
            box-sizing: border-box;
        }

        /* Checkboxes Services */
        .services-selection { display: flex; gap: 15px; margin-top: 5px; }
        .check-item { 
            flex: 1; 
            background: var(--light-bg); 
            padding: 12px; 
            border-radius: 5px; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
            box-sizing: border-box;
        }
        .check-item input { width: auto; margin-right: 10px; }

        .btn-submit { 
            background: var(--dark-blue); 
            color: white; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 5px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 30px;
            box-sizing: border-box;
        }
        .btn-submit:hover { background: var(--gold); }

        .phone-footer { color: #999; text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .phone-footer:hover { color: var(--gold); }

        footer { text-align: center; padding: 30px 20px; color: #999; font-size: 0.8rem; box-sizing: border-box; }

        /* ==========================================
           MODIFICATIONS SPECIFIQUES POUR TELEPHONE
           ========================================== */
        @media (max-width: 768px) { 
            nav { position: relative; padding: 0.5rem 0; }
            nav ul { flex-direction: column; align-items: center; }
            nav ul li { margin: 6px 0; }
            
            .hero-contact { height: 20vh; margin-top: 0; background-attachment: scroll; } 
            .container { margin: 20px auto; padding: 20px; width: 95%; }
            h1 { font-size: 1.6rem; }
            .form-row { flex-direction: column; gap: 20px; margin-bottom: 0; }
            .form-group { margin-bottom: 20px; }
            .services-selection { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="planning.html">Planning</a></li>
            <li><a href="avis.html">Avis</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="hero-contact"></div>

    <div class="container">
        <h1>Demander un devis gratuit</h1>
        <p class="promo-text">Réponse sous 24h pour vos besoins à Fismes et ses environs.</p>

        <form action="https://formspree.io/f/xbdwebao" method="POST">
            <input type="hidden" name="_next" value="https://lexivfr51.github.io/lexi-vfr/merci.html">

            <div class="form-row">
                <div class="form-group">
                    <label>Nom & Prénom</label>
                    <input type="text" name="nom" placeholder="Votre nom complet" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" name="telephone" placeholder="06 00 00 00 00" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Adresse de l'intervention (Fismes et alentours)</label>
                <input type="text" name="adresse" placeholder="Rue, Code Postal, Ville" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Surface environ (m²)</label>
                    <input type="number" name="surface" placeholder="Ex: 80">
                </div>
                <div class="form-group">
                    <label>Fréquence souhaitée</label>
                    <select name="frequence">
                        <option value="Ponctuel">Ponctuel (Grand nettoyage)</option>
                        <option value="Regulier">Régulier (Hebdomadaire)</option>
                        <option value="Quinzaine">Une semaine sur deux</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Services souhaités :</label>
                <div class="services-selection">
                    <label class="check-item"><input type="checkbox" name="service" value="Menage"> Ménage</label>
                    <label class="check-item"><input type="checkbox" name="service" value="Repassage"> Repassage</label>
                    <label class="check-item"><input type="checkbox" name="service" value="Vitres"> Vitres</label>
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Précisions (Animaux, accès...)</label>
                <textarea name="message" rows="4" placeholder="Ex: Présence d'un chien, code d'entrée..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Demander mon devis personnalisé</button>
        </form>
    </div>

    <footer>
        LEXI VFR — Service de Prestige à Fismes | <a href="tel:0644242764" class="phone-footer">06 44 24 27 64</a>
    </footer>

</body>
</html>
